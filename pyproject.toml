[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-rbac-gateway"
version = "0.1.0"
description = "Fail-closed authorization gateway (RBAC) for Home Assistant: per-user entity/area/domain access without giving users admin"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "PyYAML>=6,<7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/OWNER/ha-rbac-gateway"

[project.scripts]
ha-rbac-gateway = "ha_rbac_gateway.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101", # asserts are fine in this codebase's internal invariants and tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
